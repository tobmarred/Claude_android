<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>UIT</title>
<style>
  :root {
    --primary: #0F766E;
    --accent: #F97316;
    --text: #0F172A;
    --muted: #64748B;
    --divider: #E2E8F0;
    --bg: #F1F5F9;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--primary);
    color: #fff;
    padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
    display: flex; align-items: center; gap: 12px;
  }
  header .titles { flex: 1; }
  header .logo { font-size: 26px; font-weight: 700; letter-spacing: .15em; }
  header .subtitle { font-size: 14px; color: #CCFBF1; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: #fff; border: 2px solid #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .avatar.big { width: 88px; height: 88px; font-size: 32px; cursor: default; }
  main { flex: 1; padding: 8px 16px 96px; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 16px 18px;
    margin-top: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
  }
  .label {
    color: var(--primary); font-size: 12px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px;
  }
  .muted { color: var(--muted); font-size: 14px; }
  .title { font-size: 18px; font-weight: 700; }
  .greeting { display: flex; align-items: center; gap: 16px; padding-top: 12px; }
  .greeting img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .greeting h1 { font-size: 24px; }
  .stats { display: flex; padding: 8px 0; }
  .stats > div { flex: 1; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-caption { font-size: 12px; color: var(--muted); }
  progress {
    width: 100%; height: 6px; appearance: none; border: none;
    border-radius: 3px; overflow: hidden; background: var(--divider);
  }
  progress::-webkit-progress-bar { background: var(--divider); }
  progress::-webkit-progress-value { background: var(--accent); }
  progress::-moz-progress-bar { background: var(--accent); }
  .row { display: flex; gap: 8px; padding: 6px 0; font-size: 14px; }
  .row .key { width: 110px; flex-shrink: 0; color: var(--accent); font-weight: 700; }
  .row.link { cursor: pointer; }
  .link-text { color: var(--primary); font-weight: 700; font-size: 14px; padding-top: 10px; cursor: pointer; }
  .time { color: var(--accent); font-weight: 700; font-size: 13px; padding-top: 8px; }
  .item-title { font-size: 16px; font-weight: 700; }
  .grade-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--divider); }
  .grade-row:last-child { border-bottom: none; }
  .grade-row .name { flex: 1; font-size: 15px; }
  .grade-row .ects { font-size: 12px; color: var(--muted); }
  .grade-row .grade { font-size: 16px; font-weight: 700; color: var(--primary); }
  .grade-row .grade.open { color: var(--muted); }
  .news-date { color: var(--accent); font-weight: 700; font-size: 12px; }
  .pre { white-space: pre-line; font-size: 15px; line-height: 1.45; }
  .profile-top { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .profile-top .name { font-size: 22px; font-weight: 700; padding-top: 12px; }
  .footnote { text-align: center; color: var(--muted); font-size: 11px; padding-top: 18px; }
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: #fff;
    display: flex;
    box-shadow: 0 -2px 8px rgba(15, 23, 42, .08);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; border: none; background: none;
    color: var(--muted); font: inherit; font-size: 12px;
    padding: 8px 0; min-height: 56px; cursor: pointer; line-height: 1.4;
  }
  nav button .icon { display: block; font-size: 18px; }
  nav button.active { color: var(--primary); font-weight: 700; }

  /* Einmalige Einblend-Animation im Profil */
  .enter-zoom { animation: zoomIn .45s cubic-bezier(.34, 1.56, .64, 1) both; }
  .enter-up { animation: slideUp .5s cubic-bezier(.34, 1.3, .64, 1) both; }
  .enter-row { animation: slideIn .3s ease-out both; }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titles">
      <div class="logo">UIT</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="avatar" id="profileButton" role="button" aria-label="Mein Profil"></div>
  </header>
  <main id="content"></main>
  <nav id="nav"></nav>
</div>

const TABS = [["⌂", "Start"], ["▦", "Plan"], ["★", "Noten"], ["✉", "News"], ["☎", "Kontakt"]];
const PROFILE = 99;
const initials = DATA.firstName[0] + DATA.lastName[0];

const $content = document.getElementById("content");
const $subtitle = document.getElementById("subtitle");
const $nav = document.getElementById("nav");
let current = 0;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
const card = (inner, cls = "") => `<section class="card ${cls}">${inner}</section>`;
const label = s => `<div class="label">${esc(s)}</div>`;
const row = (k, v, extra = "") => `<div class="row ${extra}"><span class="key">${esc(k)}</span><span>${esc(v)}</span></div>`;
const stat = (v, c) => `<div><div class="stat-value">${esc(v)}</div><div class="stat-caption">${esc(c)}</div></div>`;

function home() {
  $subtitle.textContent = DATA.slogan;
  const next = DATA.schedule[0];
  const news = DATA.news[0];
  return `
    <div class="greeting">
      <img src="${PHOTO}" alt="Profilbild">
      <div>
        <h1>Hallo, ${esc(DATA.firstName)}! 👋</h1>
        <div class="muted pre">${esc(DATA.program)}\n${esc(DATA.semester)}</div>
      </div>
    </div>
    ${card(`${label("Studienfortschritt")}
      <div class="stats">${stat(DATA.ectsDone + " / " + DATA.ectsTotal, "ECTS")}${stat(DATA.gradeAverage, "Notenschnitt")}</div>
      <progress max="${DATA.ectsTotal}" value="${DATA.ectsDone}"></progress>`)}
    ${card(`${label("Nächste Veranstaltung")}
      <div class="title">${esc(next[2])}</div>
      <div class="muted pre">${esc(next[0] + ", " + next[1])}\n${esc(next[3])}</div>`)}
    ${card(`${label("Schnellzugriff")}
      ${DATA.quickLinks.map(q => `<div class="row link" data-tab="${q[2]}"><span class="key">${q[0]}</span><span>${esc(q[1])}  →</span></div>`).join("")}`)}
    ${card(`${label("Aktuelles")}
      <div class="item-title">${esc(news[1])}</div>
      <div class="muted">${esc(news[2])}</div>
      <div class="link-text" data-tab="3">Alle News →</div>`)}
  `;
}

function schedule() {
  $subtitle.textContent = "Stundenplan · diese Woche";
  const days = [];
  for (const s of DATA.schedule) {
    let day = days.find(d => d.name === s[0]);
    if (!day) days.push(day = { name: s[0], items: [] });
    day.items.push(s);
  }
  return days.map(d => card(label(d.name) + d.items.map(s => `
      <div class="time">${esc(s[1])}</div>
      <div class="item-title">${esc(s[2])}</div>
      <div class="muted" style="font-size:13px">${esc(s[3])}</div>`).join(""))).join("");
}

function grades() {
  $subtitle.textContent = "Notenübersicht";
  return card(`<div class="stats">${stat(DATA.gradeAverage, "Durchschnitt")}${stat(DATA.ectsDone, "ECTS erreicht")}</div>`) +
    card(label("Module") + DATA.grades.map(g => {
      const open = g[1] === "–";
      return `<div class="grade-row">
        <div class="name">${esc(g[0])}<div class="ects">${esc(g[2])} ECTS</div></div>
        <div class="grade ${open ? "open" : ""}">${open ? "offen" : esc(g[1])}</div>
      </div>`;
    }).join(""));
}

function news() {
  $subtitle.textContent = "Neuigkeiten";
  return DATA.news.map(n => card(`
    <div class="news-date">${esc(n[0])}</div>
    <div class="item-title" style="font-size:17px">${esc(n[1])}</div>
    <div class="muted" style="padding-top:4px">${esc(n[2])}</div>`)).join("");
}

function contacts() {
  $subtitle.textContent = "Kontakt & Service";
  return DATA.contacts.map(k => card(label(k[0]) + `<div class="pre">${esc(k[1])}</div>`)).join("") +
    card(label("Impressum & Hinweis") + `<div style="font-weight:700;font-size:15px">${esc(DATA.notice)}</div>`);
}

function profile() {
  $subtitle.textContent = "Mein Profil";
  return `
    ${card(`<div class="avatar big">${initials}</div>
      <div class="name">${esc(DATA.firstName + " " + DATA.lastName)}</div>
      <div class="muted">${esc(DATA.program)}</div>`, "profile-top")}
    ${card(label("Persönliche Daten") + row("Geburtsdatum", DATA.birthday))}
    ${card(label("Studium") + DATA.profileStudy.map(r => row(r[0], r[1])).join(""))}
    ${card(label("Kontaktdaten") + DATA.profileContact.map(r => row(r[0], r[1])).join(""))}
    <div class="footnote">Demo-Profil · Studiendaten fiktiv</div>
  `;
}

function animateProfile() {
  let delay = 0;
  [...$content.children].forEach((el, i) => {
    el.classList.add(i === 0 ? "enter-zoom" : "enter-up");
    el.style.animationDelay = delay + "ms";
    if (i > 0 && el.classList.contains("card")) {
      [...el.children].slice(1).forEach((r, j) => {
        r.classList.add("enter-row");
        r.style.animationDelay = (delay + 150 + (j + 1) * 70) + "ms";
      });
    }
    delay += 120;
  });
}

const PAGES = [home, schedule, grades, news, contacts];

function show(tab) {
  current = tab;
  $content.innerHTML = tab === PROFILE ? profile() : PAGES[tab]();
  if (tab === PROFILE) animateProfile();
  [...$nav.children].forEach((b, i) => b.classList.toggle("active", i === tab));
  window.scrollTo(0, 0);
}

$nav.innerHTML = TABS.map((t, i) =>
  `<button data-tab="${i}"><span class="icon">${t[0]}</span>${t[1]}</button>`).join("");

document.getElementById("profileButton").textContent = initials;
document.getElementById("profileButton").addEventListener("click", () => show(PROFILE));

document.addEventListener("click", e => {
  const target = e.target.closest("[data-tab]");
  if (target) show(Number(target.dataset.tab));
});

show(0);
</script>
