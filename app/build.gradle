plugins {
    id 'com.android.application'
}

android {
    namespace 'de.campuswallet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.campuswallet.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
